<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRE Vocabulary</title>
<style>
  :root { --bg:#f7f8fc; --fg:#1d2233; --muted:#5a6180; --accent:#3a55c4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151f; --fg:#e7e9f2; --muted:#a3a9c2; --accent:#8ea4ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:64px 16px; text-align:center; }
  img { width:120px; height:120px; border-radius:28px; }
  h1 { margin:16px 0 4px; }
  p { color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="GRE Vocabulary icon">
  <h1>GRE Vocabulary</h1>
  <p>Learn GRE words, idioms, phrasal verbs and grammar with flashcards, quizzes and stories read aloud.</p>
  <p><a href="https://play.google.com/store/apps/details?id=com.gauroinc.grevocabulary">Get it on Google Play</a> · <a href="privacy.html">Privacy Policy</a></p>
</main>
</body>
</html>
